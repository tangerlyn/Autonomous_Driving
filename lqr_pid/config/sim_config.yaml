lqr_pid_node:
  ros__parameters:
    waypoints_path: "/home/misys/f1tenth_ws/src/lqr_pid/racelines/basic.csv"
    odom_topic: "/pf/pose/odom"
    car_refFrame: "laser"
    global_refFrame: "map"
    drive_topic: "/sim/drive"

    # visualize topic
    #rviz_lqr_traj_topic: "/lqr_traj" # we not use now, because just one delta return.
    #rviz_nearest_point_topic: "/nearest_point"

    # PID parameters
    pid_kp: 1.0
    pid_ki: 0.0
    pid_kd: 0.1

    # LQR parameters
    lqr_preview_horizon: 6.0  # We not use now, because just one delta return.
    lqr_q_y: 100.0          # cross-track error weight
    lqr_q_yaw: 100.0        # heading-error weight
    lqr_r_steer: 1.0        # steering input weight

    # Car Parameters
    wheelbase: 0.33
    vehicle_length: 0.58
    vehicle_width: 0.31
    max_steer_rad: 0.4189
    max_steer_vel: 3.2
    max_accel: 3.0
    max_speed: 5.0
    min_speed: 0.0

    # Logic Parameters
    dt: 0.1
    dl: 0.03
    n_ind_search: 20


waypoint_visualizer_node:
  ros__parameters:
    waypoints_path: "/home/misys/f1tenth_ws/src/lqr_pid/racelines/basic.csv"
